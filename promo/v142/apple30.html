<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>SuQCanvas · 30 秒</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;font-family:'Microsoft YaHei','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:none;background:#f5f5f7;color:#1d1d1f}.dark{background:#000;color:#f5f5f7}.center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}h1,h2,p{margin:0}h1{font-size:146px;font-weight:700;letter-spacing:-8px;line-height:1.22}h2{font-size:92px;letter-spacing:-4px;line-height:1.25}p{font-size:32px;color:#86868b;margin-top:30px}.blue{background:linear-gradient(100deg,#2784ff,#ac56ef 70%,#f09d66);background-clip:text;color:transparent}.kicker{font-size:25px;letter-spacing:5px;color:#86868b;margin-bottom:28px}.product{position:absolute;border-radius:20px;overflow:hidden;box-shadow:0 35px 110px #0004;border:1px solid #ffffff22;background:#11151c}.product img{display:block;position:absolute}.photo{position:absolute;object-fit:cover;border-radius:18px;box-shadow:0 45px 90px #0003}.note{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:20px;color:#86868b}.label{position:absolute;left:108px;top:104px}.pill{padding:16px 26px;border:1px solid #333;border-radius:60px;font-size:25px;color:#b2b2b8}.word{position:absolute;font-size:112px;letter-spacing:-5px;font-weight:700}.line{position:absolute;height:3px;background:#4191ff;transform-origin:left}.last-brand{font-size:170px;font-family:'Segoe UI',sans-serif;letter-spacing:-11px;font-weight:600}.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 52% 50%,#18213a 0,transparent 64%)}
</style>

<section class="scene dark" data-start="27" data-end="30"><div class="glow"></div><div class="center"><div class="last-brand enter">SuQCanvas</div><p class="enter" style="font-size:44px;color:#f5f5f7;margin-top:45px">给灵感，一整张画布。</p><div class="kicker enter" style="margin-top:65px;margin-bottom:0">1.4.2 桌面版</div></div></section>
<script>
const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>1-Math.pow(1-clamp(x),3);
window.seek=t=>{for(const s of document.querySelectorAll('.scene')){const a=+s.dataset.start,b=+s.dataset.end,u=t-a,p=clamp(u/(b-a));s.style.display=t>=a&&t<b?'block':'none';if(t<a||t>=b)continue;
for(const [i,el] of [...s.querySelectorAll('.enter')].entries()){const e=ease((u-i*.07)/.55);el.style.opacity=e;el.style.transform=`translateY(${40*(1-e)}px) scale(${.97+.03*e})`;}
for(const el of s.querySelectorAll('.hero')){const e=ease(u/1.0);el.style.transform=`perspective(2200px) rotateX(${8*(1-e)}deg) translateY(${75*(1-e)-20*p}px) scale(${.9+.1*e+.025*p})`;}
for(const el of s.querySelectorAll('.detail,.ai,.home')){const e=ease(u/.7);el.style.transform=`translateX(${90*(1-e)}px) scale(${.98+.02*e+.022*p})`;}
for(const [i,el] of [...s.querySelectorAll('.photo')].entries()){const e=ease(u/.8);el.style.transform=`translate(${(i?-120:120)*(1-e)}px,${(i?90:-90)*(1-e)}px) rotate(${(i?4:-5)*(1-p*.3)}deg) scale(${.85+.15*e+.06*p})`;}
}};seek(1);
</script></html>
